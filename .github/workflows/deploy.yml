name: Deploy to S3 + CloudFront

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Sync site to S3
        run: |
          # Assets inmutables. El CSS y el JS llevan el hash del contenido en el
          # nombre, así que `immutable` ya no puede servir una versión vieja.
          # Los fuentes sin hash no se suben: solo se pide el bundle.
          aws s3 sync site/ s3://trustcore.es/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "videos/*" \
            --exclude "*.html" \
            --exclude "*.xml" \
            --exclude "*.txt" \
            --exclude "assets/css/components.css" \
            --exclude "assets/css/tokens.css" \
            --exclude "assets/js/components.js" \
            --exclude "assets/js/consent.js" \
            --exclude "assets/js/contact-form.js"
          aws s3 sync site/ s3://trustcore.es/ \
            --delete \
            --cache-control "no-cache, no-store, must-revalidate" \
            --exclude "*" \
            --include "*.html" \
            --include "*.xml" \
            --include "*.txt" \
            --exclude "videos/*"
          # llms.txt: la extensión .txt hace que S3 lo etiquete text/plain; la
          # especificación de llms.txt pide Markdown.
          aws s3 cp site/llms.txt s3://trustcore.es/llms.txt \
            --content-type "text/markdown; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate"
          aws s3 cp site/llms-full.txt s3://trustcore.es/llms-full.txt \
            --content-type "text/markdown; charset=utf-8" \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E3DUTT7AH6H3WN \
            --paths "/*"
