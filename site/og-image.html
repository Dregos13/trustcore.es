<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Image - TrustCore</title>
    <meta name="description" content="Página de soporte visual de TrustCore para previsualizaciones sociales (Open Graph) de la suite de facturación VeriFactu y control horario.">
    <meta name="keywords" content="og image trustcore, open graph trustcore, previsualización social, verifactu, control horario, software empresarial">
    <meta name="author" content="TrustCore">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="googlebot" content="noindex, nofollow, noarchive">
    <meta name="bingbot" content="noindex, nofollow, noarchive">
    <meta name="theme-color" content="#040F3F">
    <link rel="canonical" href="https://www.trustcore.es/og-image">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.trustcore.es/og-image">
    <meta property="og:title" content="OG Image - TrustCore">
    <meta property="og:description" content="Recurso visual oficial de TrustCore para compartición social.">
    <meta property="og:image" content="https://www.trustcore.es/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="TrustCore — VeriFactu + Control Horario">
    <meta property="og:locale" content="es_ES">
    <meta property="og:site_name" content="TrustCore">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="OG Image - TrustCore">
    <meta name="twitter:description" content="Recurso visual oficial de TrustCore para compartición social.">
    <meta name="twitter:image" content="https://www.trustcore.es/assets/og-image.png">
    <meta name="twitter:image:alt" content="TrustCore — VeriFactu + Control Horario">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        .card {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #040F3F 0%, #0B2572 60%, #1a3a8a 100%);
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 80px;
        }
        /* Decorative elements */
        .glow-1 {
            position: absolute;
            top: -80px;
            right: -60px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(83, 205, 254, 0.15), transparent);
        }
        .glow-2 {
            position: absolute;
            bottom: -40px;
            left: -40px;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(32, 113, 213, 0.15), transparent);
        }
        .grid-pattern {
            position: absolute;
            inset: 0;
            opacity: 0.03;
            background-image: url('data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2260%22 height=%2260%22><rect width=%2260%22 height=%2260%22 fill=%22none%22 stroke=%22white%22 stroke-width=%220.5%22/></svg>');
        }
        .content {
            position: relative;
            z-index: 10;
            flex: 1;
        }
        .logo-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
        }
        .logo-row img {
            height: 56px;
            width: auto;
        }
        .logo-row span {
            font-size: 32px;
            font-weight: 800;
            color: white;
            letter-spacing: -0.02em;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: rgba(32, 113, 213, 0.25);
            border: 1px solid rgba(83, 205, 254, 0.3);
            border-radius: 50px;
            margin-bottom: 24px;
        }
        .badge .dot {
            width: 10px;
            height: 10px;
            background: #53CDFE;
            border-radius: 50%;
        }
        .badge span {
            color: #53CDFE;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        h1 {
            font-size: 48px;
            font-weight: 800;
            color: white;
            line-height: 1.15;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
            max-width: 580px;
        }
        h1 .gradient {
            background: linear-gradient(90deg, #53CDFE, #2071D5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.5;
            max-width: 500px;
        }
        .subtitle strong {
            color: rgba(255, 255, 255, 0.85);
        }
        /* Right side - mini panels */
        .panels {
            position: relative;
            z-index: 10;
            width: 380px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .panel {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 20px 24px;
        }
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .panel-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .panel-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .panel-icon.green {
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }
        .panel-icon.blue {
            background: rgba(32, 113, 213, 0.3);
            color: #53CDFE;
        }
        .panel-title {
            font-size: 14px;
            font-weight: 700;
            color: white;
        }
        .panel-sub {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
        }
        .status.green {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #4ade80;
        }
        .status.cyan {
            background: rgba(83, 205, 254, 0.2);
            border: 1px solid rgba(83, 205, 254, 0.3);
            color: #53CDFE;
        }
        .status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }
        .status.green .dot { background: #4ade80; }
        .status.cyan .dot { background: #53CDFE; }
        .url-bar {
            position: absolute;
            bottom: 28px;
            right: 80px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 15px;
            font-weight: 600;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="glow-1"></div>
        <div class="glow-2"></div>
        <div class="grid-pattern"></div>

        <div class="content">
            <div class="logo-row">
                <img src="assets/trustcore-icon.png" alt="TrustCore">
                <span>TrustCore</span>
            </div>

            <div class="badge">
                <div class="dot"></div>
                <span>VeriFactu + Control Horario</span>
            </div>

            <h1>Tu empresa, <span class="gradient">100% legal y bajo control.</span></h1>

            <p class="subtitle">
                La suite que unifica <strong>Facturación VeriFactu</strong> y <strong>Control Horario</strong>. Cumplimiento normativo integral.
            </p>
        </div>

        <div class="panels">
            <div class="panel">
                <div class="panel-header">
                    <div class="panel-left">
                        <div class="panel-icon green"><i class="fas fa-file-invoice"></i></div>
                        <div>
                            <div class="panel-title">VeriFactu</div>
                            <div class="panel-sub">Conexión con Hacienda</div>
                        </div>
                    </div>
                    <div class="status green">
                        <div class="dot"></div>
                        Conectado
                    </div>
                </div>
            </div>

            <div class="panel">
                <div class="panel-header">
                    <div class="panel-left">
                        <div class="panel-icon blue"><i class="fas fa-users-cog"></i></div>
                        <div>
                            <div class="panel-title">Control Horario</div>
                            <div class="panel-sub">Registro de jornada</div>
                        </div>
                    </div>
                    <div class="status cyan">
                        <div class="dot"></div>
                        12 activos
                    </div>
                </div>
            </div>
        </div>

        <div class="url-bar">www.trustcore.es</div>
    </div>
  <script src="/assets/js/consent.js" defer></script>
  <script src="/assets/js/components.js" defer></script>
</body>
</html>
